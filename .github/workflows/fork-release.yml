name: Fork Release

# Builds this fork on top of the latest stable upstream release.
#
# Every run merges the latest stable release of home-assistant/android into the default branch of
# the fork (in the runner only, nothing is pushed), runs the unit tests and builds signed APKs that
# are published as a GitHub release. A merge conflict or a failing test stops the run before
# anything is published and is reported in an issue. See FORK.md.

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upstream-tag:
        description: "Upstream tag to build, the latest stable upstream release when empty"
        required: false
        type: string
      force:
        description: "Build even when this upstream release was already published for this fork revision"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # Never cancel a release in flight

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: home-assistant/android
  REPORT_TITLE: "Fork release failed"

jobs:
  check:
    name: Check Upstream Release
    runs-on: ubuntu-latest
    if: github.repository != 'home-assistant/android'
    outputs:
      upstream-tag: ${{ steps.check.outputs.upstream-tag }}
      release-tag: ${{ steps.check.outputs.release-tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Find the upstream release to build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream-tag }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          upstream_tag="$INPUT_UPSTREAM_TAG"
          if [[ -z "$upstream_tag" ]]; then
            # "latest" is the most recent release which is neither a draft nor a pre-release
            upstream_tag="$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" --jq .tag_name)"
          fi
          if [[ ! "$upstream_tag" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$upstream_tag' is not a stable upstream release tag"
            exit 1
          fi

          # A release is identified by the upstream release and the revision of the fork it was built from
          release_tag="${upstream_tag}-mtls.${GITHUB_SHA::7}"
          build=true
          if [[ "$INPUT_FORCE" != "true" ]] && gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            build=false
            echo "Release $release_tag already exists, nothing to do" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "upstream-tag=$upstream_tag"
            echo "release-tag=$release_tag"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Unit Tests
    needs: [check]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Report a failure
    env:
      UPSTREAM_TAG: ${{ needs.check.outputs.upstream-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the upstream release
        run: bash .github/scripts/fork-release.sh merge

      - uses: ./.github/actions/setup-build-env
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: bash .github/scripts/fork-release.sh google-services

      - name: Run unit tests
        # The tests run with the upstream application ID and name (blank overrides), so they
        # behave exactly like upstream and only tell whether the merged code works.
        run: |
          run_tests() {
            ./gradlew :common:testDebugUnitTest :app:testFullDebugUnitTest :app:compileMinimalDebugUnitTestKotlin \
              -PhomeAssistantAndroidApplicationId= -PhomeAssistantAndroidAppName=
          }
          # Robolectric downloads the Android runtime it needs from Maven Central while the tests
          # run. A failed download fails the tests it was for, a second attempt rules that out.
          if ! run_tests; then
            echo "::warning::The unit tests failed, running them a second time"
            if ! run_tests; then
              {
                echo "### Unit tests failed on upstream $UPSTREAM_TAG"
                echo
                echo "The tests of the fork merged with \`$UPSTREAM_TAG\` do not pass, see the run log for the failing tests."
              } > "$RUNNER_TEMP/report.md"
              exit 1
            fi
          fi

      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/fork-release.sh report

  # The release is built in a job of its own, on a fresh runner without any Gradle cache. Building
  # it in the workspace and Gradle daemon the tests just used makes the annotation processors of
  # the release variant generate nothing, and the build fails on the missing Hilt classes.
  release:
    name: Build And Publish
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release
      issues: write # Report a failure
    env:
      UPSTREAM_TAG: ${{ needs.check.outputs.upstream-tag }}
      RELEASE_TAG: ${{ needs.check.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the upstream release
        run: bash .github/scripts/fork-release.sh merge

      - uses: ./.github/actions/setup-build-env
        with:
          cache-disabled: "true"
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: bash .github/scripts/fork-release.sh google-services

      - name: Build signed APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEYSTORE_ALIAS" || -z "$KEYSTORE_ALIAS_PASSWORD" ]]; then
            echo "### Signing secrets are missing" > "$RUNNER_TEMP/report.md"
            echo "Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEYSTORE_ALIAS and KEYSTORE_ALIAS_PASSWORD, see FORK.md." >> "$RUNNER_TEMP/report.md"
            exit 1
          fi
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          # The version code only has to grow from one release to the next for Android to accept
          # the update over the installed app, minutes since the epoch do that without any state.
          export VERSION_CODE="$(( $(date +%s) / 60 ))"
          export VERSION_NAME="${UPSTREAM_TAG}-mtls"

          if ! ./gradlew :app:assembleFullRelease :app:assembleMinimalRelease --no-build-cache; then
            echo "### Release build failed on upstream $UPSTREAM_TAG" > "$RUNNER_TEMP/report.md"
            exit 1
          fi
          rm -f "$KEYSTORE_PATH"

          mkdir -p "$RUNNER_TEMP/apks"
          cp app/build/outputs/apk/full/release/app-full-release.apk "$RUNNER_TEMP/apks/home-assistant-mtls-$UPSTREAM_TAG-full.apk"
          cp app/build/outputs/apk/minimal/release/app-minimal-release.apk "$RUNNER_TEMP/apks/home-assistant-mtls-$UPSTREAM_TAG-minimal.apk"
          (cd "$RUNNER_TEMP/apks" && sha256sum ./*.apk > SHA256SUMS)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Verify the APK signatures
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          for apk in "$RUNNER_TEMP"/apks/*.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Home Assistant Companion for Android **$UPSTREAM_TAG** with the multi-server mTLS fix."
            echo
            echo "- Upstream release: https://github.com/$UPSTREAM_REPOSITORY/releases/tag/$UPSTREAM_TAG"
            echo "- Fork revision: $GITHUB_SHA"
            echo "- Version code: $VERSION_CODE"
            echo
            echo "Install the \`full\` APK unless you want a build without Google Play Services (\`minimal\`)."
            echo "Both install as an update over the previous release of the same flavor and keep the app data."
            echo
            echo '```'
            cat "$RUNNER_TEMP/apks/SHA256SUMS"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2> /dev/null || true
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$UPSTREAM_TAG mTLS" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest \
            "$RUNNER_TEMP"/apks/*.apk "$RUNNER_TEMP/apks/SHA256SUMS"

      - name: Close the failure report
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fork-release.sh close-report

      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/fork-release.sh report
